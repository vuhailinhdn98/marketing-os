<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Marketing OS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230ea5e9'/%3E%3Cpath d='M16 44V20l16 14 16-14v24' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="/static/js/tw-config.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" defer></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased">

  <!-- ĐĂNG NHẬP -->
  <section id="auth-screen" class="hidden min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-11 h-11 rounded-xl bg-sky-500 flex items-center justify-center text-white text-lg"><i class="fa-solid fa-chart-line"></i></div>
        <div>
          <h1 class="text-xl font-bold">Marketing OS</h1>
          <p class="text-xs text-slate-400">Hệ điều hành marketing cho doanh nghiệp nhỏ</p>
        </div>
      </div>
      <div class="flex bg-slate-800 rounded-lg p-1 mb-5 text-sm" role="tablist">
        <button type="button" data-auth-tab="login" class="auth-tab flex-1 py-2 rounded-md font-semibold">Đăng nhập</button>
        <button type="button" data-auth-tab="register" class="auth-tab flex-1 py-2 rounded-md font-semibold">Tạo tài khoản</button>
      </div>
      <form id="auth-form" class="space-y-3" novalidate>
        <div id="auth-name-row" class="hidden">
          <label class="lbl" for="auth-name">Tên hiển thị</label>
          <input id="auth-name" class="inp" autocomplete="name" maxlength="80">
        </div>
        <div>
          <label class="lbl" for="auth-email">Email</label>
          <input id="auth-email" type="email" class="inp" autocomplete="email" required>
        </div>
        <div>
          <label class="lbl" for="auth-password">Mật khẩu</label>
          <input id="auth-password" type="password" class="inp" autocomplete="current-password" required minlength="8">
          <p id="auth-pw-hint" class="hidden text-[11px] text-slate-400 mt-1">Ít nhất 8 ký tự, có cả chữ và số.</p>
        </div>
        <p id="auth-error" class="hidden text-sm text-rose-400"></p>
        <button id="auth-submit" type="submit" class="btn-primary w-full justify-center">Đăng nhập</button>
      </form>
      <div id="google-login" class="hidden mt-5">
        <div class="flex items-center gap-3 text-xs text-slate-500 mb-3"><span class="flex-1 h-px bg-slate-800"></span>hoặc<span class="flex-1 h-px bg-slate-800"></span></div>
        <div id="google-btn" class="flex justify-center"></div>
      </div>
      <p class="text-[11px] text-slate-500 mt-6 leading-relaxed">Mỗi tài khoản là một workspace riêng. Dữ liệu khách hàng chỉ dùng để tiếp thị khi khách đã đồng ý (Luật 91/2025/QH15).</p>
    </div>
  </section>

  <!-- ỨNG DỤNG -->
  <div id="app" class="hidden min-h-screen md:flex">
    <aside id="sidebar" class="hidden md:flex md:flex-col w-64 shrink-0 bg-slate-900/80 border-r border-slate-800 h-screen sticky top-0">
      <div class="px-5 py-4 border-b border-slate-800 flex items-center gap-3">
        <div class="w-9 h-9 rounded-lg bg-sky-500 flex items-center justify-center text-white"><i class="fa-solid fa-chart-line"></i></div>
        <div class="min-w-0">
          <div class="font-bold leading-tight">Marketing OS</div>
          <div id="side-brand" class="text-xs text-slate-400 truncate">Chưa đặt tên</div>
        </div>
      </div>
      <nav id="nav" class="flex-1 overflow-y-auto p-3 space-y-0.5 text-sm" aria-label="Điều hướng"></nav>
      <div class="p-3 border-t border-slate-800 text-xs text-slate-400 flex items-center justify-between gap-2">
        <span id="side-user" class="truncate"></span>
        <button type="button" data-global="logout" class="text-slate-400 hover:text-rose-400" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </aside>

    <div class="flex-1 min-w-0 flex flex-col">
      <header class="sticky top-0 z-30 bg-slate-950/90 backdrop-blur border-b border-slate-800 px-4 md:px-6 py-3 flex items-center gap-3">
        <button type="button" class="md:hidden w-9 h-9 rounded-lg bg-slate-800 text-slate-200" data-global="drawer" aria-label="Mở menu"><i class="fa-solid fa-bars"></i></button>
        <h2 id="view-title" class="font-bold text-base md:text-lg truncate flex-1">Tổng quan</h2>
        <span id="ai-badge" class="hidden sm:inline-flex items-center gap-1.5 text-xs px-2.5 py-1 rounded-full border"></span>
      </header>
      <div id="banner" class="hidden"></div>
      <main id="view" class="flex-1 p-4 md:p-6 pb-24 md:pb-8 max-w-7xl w-full mx-auto"></main>
    </div>

    <!-- Điều hướng di động -->
    <nav id="bottom-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-slate-900 border-t border-slate-800 grid grid-cols-5 text-[10px]" aria-label="Điều hướng nhanh"></nav>
    <div id="drawer" class="hidden fixed inset-0 z-50 md:hidden">
      <div class="absolute inset-0 bg-black/60" data-global="drawer-close"></div>
      <div class="absolute left-0 top-0 bottom-0 w-72 bg-slate-900 border-r border-slate-800 flex flex-col">
        <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
          <span class="font-bold">Marketing OS</span>
          <button type="button" data-global="drawer-close" class="w-8 h-8 rounded-lg bg-slate-800" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <nav id="drawer-nav" class="flex-1 overflow-y-auto p-3 space-y-0.5 text-sm"></nav>
        <button type="button" data-global="logout" class="m-3 btn-ghost justify-center"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="fixed z-[100] bottom-20 md:bottom-6 right-4 left-4 md:left-auto md:w-96 space-y-2 pointer-events-none" aria-live="polite"></div>

  <script src="/static/js/core.js" defer></script>
  <script src="/static/js/ui.js" defer></script>
  <script src="/static/js/views/home.js" defer></script>
  <script src="/static/js/views/studio.js" defer></script>
  <script src="/static/js/views/content.js" defer></script>
  <script src="/static/js/views/leads.js" defer></script>
  <script src="/static/js/views/growth.js" defer></script>
  <script src="/static/js/views/tools.js" defer></script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
