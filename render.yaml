services:
  - type: web
    name: marketing-os
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
    # Gói free dùng ổ đĩa tạm: dữ liệu mất khi dịch vụ khởi động lại.
    # Dùng thật: đổi plan sang gói trả phí, bỏ chú thích 4 dòng dưới và thêm biến DATA_DIR=/var/data.
    # disk:
    #   name: marketing-os-data
    #   mountPath: /var/data
    #   sizeGB: 1
